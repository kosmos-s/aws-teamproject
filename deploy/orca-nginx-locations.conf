# Include inside the existing portal TLS server; no new public port.
location = /_orca_auth {
    internal;
    proxy_pass http://127.0.0.1:8000/api/orca/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location = /_admin_auth {
    internal;
    proxy_pass http://127.0.0.1:8000/api/admin/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}
location = /orca/runtime {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
location = /orca { return 302 /orca/web-index.html; }
location /orca/ {
    auth_request /_orca_auth;
    proxy_pass http://127.0.0.1:6768/;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-For "";
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # All websocket upgrades must use the session-revalidating gateway.
    if ($http_upgrade != "") { return 403; }
}
location = /webmin { return 302 /webmin/; }
location /webmin/ {
    auth_request /_admin_auth;
    proxy_pass http://127.0.0.1:10000/;
    proxy_cookie_flags sid secure httponly samesite=lax;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    add_header Cache-Control "no-store" always;
}
